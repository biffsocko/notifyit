name: CI
on: 
  push:
    branches: ["**"] 
  pull_request:
  workflow_call:            # triggers

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3      # installs and runs ruff check
      - uses: astral-sh/ruff-action@v3
        with: { args: "format --check" }

  test:
    runs-on: ubuntu-latest          # the runner
    steps:
      - uses: actions/checkout@v7   # get your code
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt ruff pytest
      - run: ruff check .
      - run: pytest
