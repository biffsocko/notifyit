name: CI
on: [push, pull_request]            # triggers
jobs:
  test:
    runs-on: ubuntu-latest          # the runner
    steps:
      - uses: actions/checkout@v4   # get your code
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt ruff pytest
      - run: ruff check .
      - run: pytest
